<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Bhargavi Thoka. I build AI apps that do the busywork.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#151a3d"/>
      <stop offset="1" stop-color="#2a1446"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0; 0.3 0; -0.3 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- soft moving lights -->
  <circle cx="980" cy="70" r="190" fill="url(#glow1)">
    <animate attributeName="cx" values="980;1030;980" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="260" r="210" fill="url(#glow2)">
    <animate attributeName="cy" values="260;220;260" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- a small network of nodes, like a model graph -->
  <g stroke="#a5b4fc" stroke-opacity="0.25" stroke-width="1.2">
    <line x1="870" y1="110" x2="950" y2="70"/><line x1="950" y1="70" x2="1040" y2="105"/>
    <line x1="870" y1="110" x2="930" y2="170"/><line x1="930" y1="170" x2="1040" y2="105"/>
    <line x1="930" y1="170" x2="1020" y2="215"/><line x1="1040" y1="105" x2="1110" y2="160"/>
    <line x1="1020" y1="215" x2="1110" y2="160"/><line x1="950" y1="70" x2="930" y2="170"/>
  </g>
  <g fill="#c4b5fd">
    <circle cx="870" cy="110" r="5"><animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="70" r="6"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="105" r="5"><animate attributeName="opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="170" r="7" fill="#f472b6"><animate attributeName="r" values="6;8;6" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="215" r="5"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="160" r="6" fill="#60a5fa"><animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- little stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.4" opacity="0.6"/><circle cx="320" cy="30" r="1.2" opacity="0.5"/>
    <circle cx="610" cy="50" r="1.5" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="250" r="1.3" opacity="0.5"/><circle cx="520" cy="270" r="1.2" opacity="0.6"/>
    <circle cx="1150" cy="40" r="1.4" opacity="0.6"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="5s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="70" y="88" fill="#a5b4fc" font-size="20" font-weight="600" letter-spacing="4">BHARGAVI THOKA</text>
    <text x="68" y="158" fill="url(#title)" font-size="50" font-weight="800">I build AI apps that</text>
    <text x="68" y="214" fill="url(#title)" font-size="50" font-weight="800">do the busywork.</text>
    <text x="70" y="258" fill="#cbd5e1" font-size="19">AI/ML engineer · LLM tools, voice, data and the full stack around them</text>
  </g>
</svg>
